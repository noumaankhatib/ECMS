# AWS single-instance stack. Differs from ../../docker-compose.prod.yml by:
# images tagged per release (instant rollback), healthchecks, memory limits sized
# for a 2 GB instance, CloudWatch log shipping, and nothing published but port 80.
# Run via remote-deploy.sh with: -p ecms --env-file /opt/ecms/.env

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: awslogs
      options: { awslogs-region: '${AWS_REGION}', awslogs-group: '/${PROJECT}/postgres' }
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_SUPER_USER}
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../docker/postgres/init-prod.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_SUPER_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: ecms-api:${RELEASE}
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: awslogs
      options: { awslogs-region: '${AWS_REGION}', awslogs-group: '/${PROJECT}/api' }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      DRIVE_BACKEND: postgres
      APP_VERSION: ${RELEASE}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health/ready >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    expose: ['3001']

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: ecms-web:${RELEASE}
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: awslogs
      options: { awslogs-region: '${AWS_REGION}', awslogs-group: '/${PROJECT}/web' }
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: http://api:3001
      COOKIE_SECURE: ${COOKIE_SECURE}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    expose: ['3000']

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: awslogs
      options: { awslogs-region: '${AWS_REGION}', awslogs-group: '/${PROJECT}/nginx' }
    depends_on:
      web: { condition: service_healthy }
    ports:
      - '80:80'
    volumes:
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
