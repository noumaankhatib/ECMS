# Local development infrastructure only. Not a deployment artifact.
services:
  postgres:
    build: ./docker/postgres
    container_name: ecms-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ecms}
      # Only takes effect the first time the data volume is created — if you
      # change DB_SUPER_USER/PASSWORD in .env afterward, it will NOT update
      # the running container's actual password. Recreate the volume
      # (`pnpm run db:wipe`) if the two ever drift apart.
      POSTGRES_USER: ${DB_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - ecms-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Probe the real path a client uses, not just whether the process is up.
      test: ['CMD-SHELL', 'psql -U postgres -d ecms -c "SELECT 1" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ecms-pgdata:
