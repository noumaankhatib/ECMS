# Full stack in Docker for local use: postgres + api + web + nginx on http://localhost:8080.
# Reuses the dev database volume (kashif_ecms-pgdata) so existing data is kept.
#   pnpm run stack:up      pnpm run stack:down
# Secrets come from .env (DB_*, SESSION_SECRET). Not a deployment artifact.
name: kashif
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-ecms}
      POSTGRES_USER: ${DB_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD:-postgres}
    volumes:
      - ecms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_SUPER_USER:-postgres} -d ${DB_NAME:-ecms}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecms}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: 'false'
      DRIVE_BACKEND: ${DRIVE_BACKEND:-postgres}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
      COOKIE_SECURE: 'false'

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - web
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  ecms-pgdata:
    external: true
    name: kashif_ecms-pgdata
